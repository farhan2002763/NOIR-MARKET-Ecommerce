<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandbox Checkout | NOIR MARKET</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand">NOIR MARKET</div><span>SECURE CHECKOUT · LOCAL DEMO</span><a href="/">Back to store</a></header><main class="checkoutPage"><div class="panel checkoutPanel"><span class="eyebrow">SIMULATED PAYMENT · NO REAL CHARGES</span><h1>Checkout sandbox.</h1><p class="muted">This is an offline demo for internship testing. No card details are requested, no payment provider is contacted and no real money moves.</p><div id="orderInfo" class="checkoutSummary">Loading order…</div><div class="checkoutActions"><button id="pay" class="primary">Simulate successful payment</button><button id="cancel" class="outline">Cancel order</button></div><p id="status" role="status"></p></div></main><script>const id=Number(new URLSearchParams(location.search).get('order'));const status=document.getElementById('status');async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const o=await api('/api/demo/order/'+id);document.getElementById('orderInfo').textContent='Order #'+o.id+' · $'+(o.total/100).toFixed(2)+' · '+o.status;document.getElementById('pay').disabled=o.status!=='pending';document.getElementById('cancel').disabled=o.status!=='pending'}catch(e){status.textContent=e.message}}document.getElementById('pay').onclick=async()=>{try{const r=await api('/api/demo/complete','POST',{id});status.textContent=r.message;await load()}catch(e){status.textContent=e.message}};document.getElementById('cancel').onclick=async()=>{try{await api('/api/demo/cancel','POST',{id});status.textContent='Demo order cancelled; stock unchanged.';await load()}catch(e){status.textContent=e.message}};load();</script></body></html>
